<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#182235"/>
  <circle cx="400" cy="300" r="240" fill="#23324D" opacity="0.65"/>
  <!-- Incoming cultural rays (Nho học, Đạo giáo, Phương Tây) -->
  <g stroke-linecap="round">
    <line x1="60" y1="160" x2="325" y2="270" stroke="#F59E0B" stroke-width="14" opacity="0.85"/>
    <line x1="60" y1="300" x2="310" y2="300" stroke="#60A5FA" stroke-width="14" opacity="0.85"/>
    <line x1="60" y1="440" x2="325" y2="330" stroke="#34D399" stroke-width="14" opacity="0.85"/>
  </g>
  <!-- Labels on left -->
  <rect x="44" y="116" width="146" height="32" rx="16" fill="#F59E0B"/>
  <text x="117" y="137" font-family="sans-serif" font-size="14" font-weight="700" fill="#182235" text-anchor="middle">Nho học · Đông</text>
  <rect x="44" y="254" width="146" height="32" rx="16" fill="#60A5FA"/>
  <text x="117" y="275" font-family="sans-serif" font-size="14" font-weight="700" fill="#182235" text-anchor="middle">Văn minh Tây</text>
  <rect x="44" y="394" width="146" height="32" rx="16" fill="#34D399"/>
  <text x="117" y="415" font-family="sans-serif" font-size="14" font-weight="700" fill="#182235" text-anchor="middle">Đạo · Tín ngưỡng</text>
  <!-- Refraction Prism (Lăng kính Tâm thức Việt) -->
  <polygon points="400,130 515,430 285,430" fill="#F9E8D2" fill-opacity="0.2" stroke="#F5B041" stroke-width="5"/>
  <circle cx="400" cy="315" r="54" fill="#C85A32" opacity="0.9"/>
  <!-- Lotus inside prism -->
  <path d="M400 278 C416 298 416 326 400 340 C384 326 384 298 400 278 Z" fill="#FDE68A"/>
  <path d="M400 340 C425 335 436 312 426 295 C415 304 404 322 400 340 Z" fill="#FCD34D"/>
  <path d="M400 340 C375 335 364 312 374 295 C385 304 396 322 400 340 Z" fill="#FCD34D"/>
  <!-- Refracted Unified Golden Output -->
  <path d="M465 300 L740 215 L740 385 Z" fill="#FBBF24" opacity="0.28"/>
  <line x1="465" y1="300" x2="735" y2="300" stroke="#FDE047" stroke-width="18" stroke-linecap="round"/>
  <rect x="550" y="252" width="205" height="36" rx="18" fill="#C85A32"/>
  <text x="652" y="275" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Khúc xạ thành Bản sắc Việt</text>
</svg>
    <linearGradient id="roof1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B84426"/><stop offset="100%" stop-color="#7D2914"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky1)"/>
  <circle cx="640" cy="130" r="78" fill="#E89A3C" opacity="0.45"/>

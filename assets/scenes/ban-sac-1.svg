  <path d="M250 302 Q400 218 550 302 Q400 265 250 302 Z" fill="#9E331A"/>
  <!-- 4 Pillars of Vietnamese Identity -->
  <g transform="translate(595, 195)">
    <rect x="0" y="0" width="155" height="215" rx="16" fill="#FFFFFF" opacity="0.92" stroke="#C85A32" stroke-width="2.5"/>
    <circle cx="34" cy="42" r="14" fill="#C85A32"/><text x="34" y="47" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="58" y="47" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#1C2536">Tổ quốc</text>
    <circle cx="34" cy="88" r="14" fill="#2E6F5E"/><text x="34" y="93" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="58" y="93" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#1C2536">Làng xã</text>
    <circle cx="34" cy="134" r="14" fill="#D97706"/><text x="34" y="139" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="58" y="139" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#1C2536">Thân phận</text>
    <circle cx="34" cy="180" r="14" fill="#3B5998"/><text x="34" y="185" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="58" y="185" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#1C2536">Diện mạo</text>
